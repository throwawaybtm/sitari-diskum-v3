<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SI-TARI — Pratinjau Ponsel Lokal</title>
<style>*{scrollbar-width:none}*::-webkit-scrollbar{display:none}body{margin:0;background:#e8eef0;color:#143238;font:16px/1.5 system-ui,sans-serif}header{padding:16px;background:#fff;border-bottom:1px solid #cbd5e1}h1{font-size:22px;margin:0 0 12px}nav{display:flex;flex-wrap:wrap;gap:16px;align-items:end}label{display:grid;gap:4px}select,a{font:inherit;min-height:48px;box-sizing:border-box;padding:10px;border:1px solid #94a3b8;border-radius:10px;background:white;color:inherit}p{margin:12px 0 0}main{padding:24px;overflow:auto}iframe{display:block;border:1px solid #94a3b8;border-radius:16px;background:white;box-shadow:0 12px 40px #14323820;margin:auto;width:390px;height:780px;max-width:none}</style></head>
<body><header><h1>SI-TARI — Pratinjau Ponsel Lokal</h1><nav>
<label>Halaman<select id="page"><option value="/">Admin</option><option value="/tamu-luar">Form TLD</option><option value="/tamu-fo">Form TDD</option><option value="/?page=presensi">Dashboard Presensi</option><option value="/?preview=meeting">Buat Jadwal Rapat</option></select></label>
<label>Lebar layar<select id="width"><option value="320">320 px — kecil</option><option value="360">360 px</option><option value="390" selected>390 px</option><option value="767">767 px — batas ponsel</option><option value="1024">1024 px — desktop</option></select></label>
<a id="open" href="/" target="_blank" rel="noopener">Buka halaman</a></nav><p>Pratinjau ini hanya menggunakan data lokal. Ubah lebar layar untuk membandingkan tampilan.</p></header>
<main><iframe id="preview" title="Pratinjau SI-TARI" src="/"></iframe></main>
<script>
const preview=document.getElementById('preview');
document.getElementById('width').addEventListener('change',event=>{preview.style.width=event.target.value+'px';});
document.getElementById('page').addEventListener('change',event=>{preview.src=event.target.value;document.getElementById('open').href=event.target.value;});
preview.addEventListener('load',()=>{
  if(document.getElementById('page').value!=='/?preview=meeting')return;
  preview.contentWindow.switchTab('calendar');
  preview.contentWindow.bukaModalRapat();
});
</script></body></html>

  <script>
    const PEMKO_OPD_OPTIONS = Object.freeze([
      'Asisten Pemerintahan dan Kesejahteraan Rakyat',
      'Asisten Administrasi Umum',
      'Asisten Perekonomian dan Pembangunan',
      'Sekretariat Daerah Kota Batam',
      'Sekretariat DPRD Kota Batam',
      'Inspektorat Daerah Kota Batam',
      'Badan Kepegawaian Dan Pengembangan Sumber Daya Manusia Kota Batam',
      'Badan Pendapatan Daerah Kota Batam',
      'Badan Pengelolaan Keuangan Dan Aset Daerah Kota Batam',
      'Badan Perencanaan Pembangunan Daerah Kota Batam',
      'Dinas Kependudukan Dan Pencatatan Sipil Kota Batam',
      'Dinas Kesehatan Kota Batam',
      'Dinas Penanaman Modal Dan Pelayanan Terpadu Satu Pintu Kota Batam',
      'Dinas Pendidikan Kota Batam',
      'Dinas Pertanahan Kota Batam',
      'Dinas Perumahan, Kawasan Permukiman Dan Pertanaman Kota Batam',
      'Badan Kesatuan Bangsa Dan Politik Kota Batam',
      'Badan Penanggulangan Bencana Daerah Kota Batam',
      'Badan Riset Dan Inovasi Daerah Kota Batam',
      'Dinas Bina Marga Dan Sumber Daya Air Kota Batam',
      'Dinas Cipta Karya Dan Tata Ruang Kota Batam',
      'Dinas Kebudayaan Dan Pariwisata Kota Batam',
      'Dinas Kepemudaan Dan Olahraga Kota Batam',
      'Dinas Ketahanan Pangan Dan Pertanian Kota Batam',
      'Dinas Komunikasi Dan Informatika Kota Batam',
      'Dinas Lingkungan Hidup Kota Batam',
      'Dinas Pemadam Kebakaran Dan Penyelamatan Kota Batam',
      'Dinas Pemberdayaan Perempuan, Perlindungan Anak, Pengendalian Penduduk Dan Keluarga Berencana Kota Batam',
      'Dinas Perhubungan Kota Batam',
      'Dinas Perikanan Kota Batam',
      'Dinas Perindustrian Dan Perdagangan Kota Batam',
      'Dinas Perpustakaan Dan Kearsipan Kota Batam',
      'Dinas Sosial Dan Pemberdayaan Masyarakat Kota Batam',
      'Dinas Tenaga Kerja Kota Batam',
      'Rumah Sakit Umum Daerah Embung Fatimah Kota Batam',
      'Satuan Polisi Pamong Praja Kota Batam',
      'Kelurahan',
      'Kecamatan'
    ]);
    const PEMKO_WILAYAH_TYPES = new Set(['Kelurahan', 'Kecamatan']);

    let masterPegawai = [];
    let masterOpd = PEMKO_OPD_OPTIONS.map((nama_opd, idx) => ({ id: idx + 1, nama_opd, kategori: 'Pemko Batam' }));
    let currentKategori = 'Diskum';
    let lastPemkoOpdSelection = '';
    let presensiMeetings = [];
    let visitRosterMode = false;
    let visitRosterData = null;
    let visitRosterRequest = 0;

    function isPemkoWilayahType(value) {
      return PEMKO_WILAYAH_TYPES.has(String(value || '').trim());
    }

    function formatPemkoOpdName(opdCategory, specificName) {
      const category = String(opdCategory || '').trim();
      if (!isPemkoWilayahType(category)) return category;
      const raw = String(specificName || '').trim();
      if (!raw) return '';
      const stripped = raw.replace(new RegExp('^' + category + '\\b[\\s:.-]*', 'i'), '').trim();
      return category + ' - ' + (stripped || raw);
    }

    function syncPemkoWilayahField(clearIfChanged = false) {
      const selOpd = document.getElementById('selectOpdPemko');
      const wrap = document.getElementById('pemkoWilayahField');
      const labelText = document.getElementById('labelWilayahPemkoText');
      const input = document.getElementById('inputWilayahPemko');
      if (!selOpd || !wrap || !input) return;
      const selected = String(selOpd.value || '').trim();
      const isWilayah = isPemkoWilayahType(selected);
      if (!isWilayah || (clearIfChanged && lastPemkoOpdSelection && lastPemkoOpdSelection !== selected)) {
        input.value = '';
      }
      lastPemkoOpdSelection = selected;
      wrap.hidden = !isWilayah;
      if (wrap.classList) {
        if (isWilayah) wrap.classList.remove('hidden');
        else wrap.classList.add('hidden');
      }
      if (isWilayah) {
        if (labelText) labelText.textContent = 'Nama ' + selected;
        input.placeholder = selected === 'Kelurahan' ? 'Contoh: Baloi Permai' : 'Contoh: Lubuk Baja';
      }
      input.required = currentKategori === 'OPD_Pemko' && isWilayah;
      if (typeof input.setCustomValidity === 'function') input.setCustomValidity('');
    }

    function onOpdPemkoChange() {
      syncPemkoWilayahField(true);
    }

    function populatePemkoOpdOptions() {
      const selOpd = document.getElementById('selectOpdPemko');
      if (!selOpd) return;
      const current = String(selOpd.value || '').trim();
      selOpd.replaceChildren(new Option('-- Pilih OPD Pemko Batam --', ''));
      PEMKO_OPD_OPTIONS.forEach(name => selOpd.add(new Option(name, name)));
      if (current && PEMKO_OPD_OPTIONS.includes(current)) {
        selOpd.value = current;
      }
      syncPemkoWilayahField(false);
    }

    function isAdminAttendance() {return document.body?.dataset?.adminAttendance==='true';}
    function attendanceFormAvailability(meeting) {return isAdminAttendance()?adminAttendanceAvailability(meeting):attendanceAvailability(meeting);}
    function updateAdminAttendanceTime(agenda) {
      const admin=isAdminAttendance(),field=document.getElementById('inputJamKehadiran');
      document.getElementById('adminAttendanceTime').hidden=!admin;field.disabled=!admin;field.required=admin;
      if(admin){field.value=agenda?.jam_mulai||'';document.getElementById('attendanceTimeDate').textContent=agenda?'Tanggal agenda: '+formatPresensiMeetingDate(agenda.tanggal)+' WIB':'';}
    }
    function formatPresensiMeetingDate(value) {
      const text = String(value || '');
      const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(text);
      return match ? `${match[3]}-${match[2]}-${match[1]}` : (text || '-');
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateAdminAttendanceTime(null);
      populatePemkoOpdOptions();
      loadInitialData();
    });

    function loadInitialData() {
      populatePemkoOpdOptions();
      // Load rapat
      callBackend('getRapatCalendar', [], res => {
        const sel = document.getElementById('selectRapat');
        sel.replaceChildren();
        if (res && res.success) {
          const meetings = Array.isArray(res.data) ? res.data : [];
          presensiMeetings = meetings;
          if (meetings.length === 0) {
            sel.add(new Option('-- Belum ada jadwal rapat --', '', true, true));
            sel.disabled = true;
          } else {
            sel.add(new Option('-- Pilih Jadwal Rapat --', '', true, true));
            meetings.forEach(r => sel.add(new Option(
              `${r.judul_rapat || '-'} (${r.nama_ruangan || '-'})`,
              String(r.id || '')
            )));
            function selectAgenda(id) {
              if(!id)return;
              const selected = meetings.find(r => String(r.id) === String(id));
              if (!selected) {sel.replaceChildren(new Option('Agenda pada QR tidak ditemukan', ''));sel.disabled=true;return;}
              const label=sel.options?Array.from(sel.options).find(o=>String(o.value)===String(id))?.text:selected.judul_rapat;
              sel.replaceChildren(new Option(label||selected.judul_rapat,String(selected.id)));
              sel.value = String(selected.id);
              sel.disabled=true;
              onPresensiAgendaChange();
            }
            if (typeof window !== 'undefined' && window.location) selectAgenda(new URLSearchParams(window.location.search).get('id'));
            if (typeof google !== 'undefined' && google.script && google.script.url) google.script.url.getLocation(loc => selectAgenda(loc.parameter.id));
          }
        } else {
          sel.add(new Option('-- Jadwal rapat gagal dimuat --', '', true, true));
          sel.disabled = true;
        }
      }, err => {
        console.error('getRapatCalendar failed:', err);
        const sel = document.getElementById('selectRapat');
        sel.replaceChildren(new Option('-- Jadwal rapat gagal dimuat --', '', true, true));
        sel.disabled = true;
      });

      callBackend('getMasterData', [], res => {
        const selPegawai = document.getElementById('selectPegawaiDiskum');
        selPegawai.replaceChildren(new Option('-- Pilih Nama Pegawai Diskum --', ''));

        if (res && res.success) {
          const normalizeUnit = value => {
            const raw = String(value || '').trim();
            return raw === 'UPTD Pemberdayaan dan Pelindungan Koperasi'
              ? 'Bidang Pemberdayaan dan Pelindungan Koperasi'
              : raw;
          };
          masterPegawai = (Array.isArray(res.data && res.data.pegawai) ? res.data.pegawai : [])
            .map(p => Object.assign({}, p, { bidang: normalizeUnit(p.bidang) }));
          const department=document.getElementById('selectBidangDiskum');
          department.replaceChildren(new Option('-- Pilih Bidang / Unit Kerja --',''));
          const preferred=['Dinas','Sekretariat','Bidang Pemberdayaan dan Pelindungan Koperasi','Bidang Pengawasan Koperasi','Bidang Kewirausahaan','Bidang Pengembangan Usaha Mikro','UPTD Pengelolaan Dana Bergulir','UPTD PLUT KUMKM'];
          const departments=[...new Set(masterPegawai.map(p=>p.bidang).filter(Boolean))].sort((a,b)=>{const i=preferred.indexOf(a),j=preferred.indexOf(b);return (i<0?99:i)-(j<0?99:j)||a.localeCompare(b,'id');});
          departments.forEach(name=>department.add(new Option(name+' ('+masterPegawai.filter(p=>p.bidang===name).length+')',name)));
          department.disabled=!departments.length;onBidangDiskumChange();
          if (masterPegawai.length === 0) selPegawai.add(new Option('Belum ada data pegawai', '', true, true));
        } else {
          masterPegawai = [];
          document.getElementById('selectBidangDiskum').disabled=true;selPegawai.disabled=true;
          selPegawai.replaceChildren(new Option('Data pegawai gagal dimuat', '', true, true));
        }
      }, err => {
        console.error('getMasterData failed:', err);
        masterPegawai = [];
        document.getElementById('selectBidangDiskum').disabled=true;document.getElementById('selectPegawaiDiskum').disabled=true;
        document.getElementById('selectPegawaiDiskum').replaceChildren(new Option('Data pegawai gagal dimuat', '', true, true));
      });
    }

    function setKategoriPeserta(kat) {
      if(visitRosterMode)kat='Tamu_Luar';
      currentKategori = kat;
      document.getElementById('selectPegawaiDiskum').required = kat === 'Diskum';
      document.getElementById('selectBidangDiskum').required = kat === 'Diskum';
      document.getElementById('selectOpdPemko').required = kat === 'OPD_Pemko';
      document.getElementById('inputNamaPemko').required = kat === 'OPD_Pemko';
      const namaTamu = document.getElementById('inputNamaTamu');
      const instansiTamu = document.getElementById('inputInstansiTamu');
      const jabatanTamu = document.getElementById('inputJabatanTamu');
      namaTamu.required = kat === 'Tamu_Luar' && !visitRosterMode;
      document.getElementById('selectTamuRombongan').required = kat === 'Tamu_Luar' && visitRosterMode;
      instansiTamu.required = kat === 'Tamu_Luar';
      jabatanTamu.required = kat === 'Tamu_Luar';
      if ((kat !== 'Tamu_Luar' || visitRosterMode) && typeof namaTamu.setCustomValidity === 'function') namaTamu.setCustomValidity('');
      if (kat !== 'Tamu_Luar') {
        if (typeof instansiTamu.setCustomValidity === 'function') instansiTamu.setCustomValidity('');
        if (typeof jabatanTamu.setCustomValidity === 'function') jabatanTamu.setCustomValidity('');
      }
      document.getElementById('sectionTamu').classList[kat === 'Tamu_Luar' ? 'remove' : 'add']('hidden');
      document.getElementById('btnKatTamu').className = 'py-3 px-4 rounded-xl border-2 font-bold text-xs ' + (kat === 'Tamu_Luar' ? 'border-teal-600 bg-teal-50 text-teal-900' : 'border-slate-200 bg-white text-slate-700');
      const btnDiskum = document.getElementById('btnKatDiskum');
      const btnPemko = document.getElementById('btnKatPemko');
      const secDiskum = document.getElementById('sectionDiskum');
      const secPemko = document.getElementById('sectionPemko');

      if (kat === 'Diskum') {
        btnDiskum.className = 'py-3 px-4 rounded-xl border-2 font-bold text-xs transition flex flex-col items-center justify-center space-y-1 border-blue-600 bg-blue-50 text-blue-900';
        btnPemko.className = 'py-3 px-4 rounded-xl border-2 font-bold text-xs transition flex flex-col items-center justify-center space-y-1 border-slate-200 bg-white text-slate-700 hover:border-slate-300';
        secDiskum.classList.remove('hidden');
        secPemko.classList.add('hidden');
      } else {
        btnPemko.className = 'py-3 px-4 rounded-xl border-2 font-bold text-xs transition flex flex-col items-center justify-center space-y-1 border-blue-600 bg-blue-50 text-blue-900';
        btnDiskum.className = 'py-3 px-4 rounded-xl border-2 font-bold text-xs transition flex flex-col items-center justify-center space-y-1 border-slate-200 bg-white text-slate-700 hover:border-slate-300';
        secDiskum.classList.add('hidden');
        secPemko.classList.remove('hidden');
      }
      if (kat === 'Tamu_Luar') {
        secDiskum.classList.add('hidden'); secPemko.classList.add('hidden');
        btnPemko.className = btnDiskum.className;
      }
      syncPemkoWilayahField(false);
    }

    function onPresensiAgendaChange() {
      const id=document.getElementById('selectRapat').value;
      const agenda=presensiMeetings.find(m=>String(m.id)===String(id));
      updateAdminAttendanceTime(agenda);
      const request=++visitRosterRequest;
      visitRosterMode=Boolean(agenda&&(agenda.kode_kunjungan||/^VISIT-|^LOCAL-VISIT-/.test(agenda.kode_rapat||'')));
      visitRosterData=null;
      document.getElementById('visitRosterField').hidden=!visitRosterMode;
      document.getElementById('freeTamuName').hidden=visitRosterMode;
      document.getElementById('inputInstansiTamu').readOnly=visitRosterMode;
      document.getElementById('inputInstansiTamu').value='';
      document.getElementById('btnKatDiskum').disabled=visitRosterMode;
      document.getElementById('btnKatPemko').disabled=visitRosterMode;
      document.getElementById('btnSubmitPresensi').disabled=visitRosterMode;
      setKategoriPeserta(visitRosterMode?'Tamu_Luar':'Diskum');
      const availability=attendanceFormAvailability(agenda);
      document.getElementById('attendanceWindowMessage').textContent=availability.open?'':availability.message;
      document.getElementById('btnSubmitPresensi').disabled=!availability.open||visitRosterMode;
      if(!availability.open){document.getElementById('selectTamuRombongan').disabled=true;document.getElementById('visitRosterMessage').textContent=availability.message;return;}
      if(!visitRosterMode)return;
      const select=document.getElementById('selectTamuRombongan'),message=document.getElementById('visitRosterMessage');
      select.replaceChildren(new Option('Memuat daftar rombongan...','')); select.disabled=true;
      message.textContent='Memuat nama dari permohonan kunjungan.';
      callBackend('getVisitAttendanceRoster',[{rapat_id:id}],res=>{
        if(request!==visitRosterRequest)return;
        if(!res||!res.success){message.textContent=res&&res.error||'Daftar rombongan gagal dimuat. Pilih ulang agenda untuk mencoba lagi.';return;}
        visitRosterData=res.data;
        select.replaceChildren(new Option('Pilih nama terdaftar',''));
        res.data.roster.forEach(member=>{const option=new Option(member.nama+' — '+member.peran+(member.attended?' (Sudah hadir)':''),member.id);option.disabled=member.attended;select.add(option);});
        document.getElementById('inputInstansiTamu').value=res.data.instansi;
        select.disabled=res.data.locked;
        document.getElementById('btnSubmitPresensi').disabled=res.data.locked;
        message.textContent=res.data.locked?'Presensi sudah divalidasi dan tidak dapat diubah.':'';
      },()=>{if(request===visitRosterRequest)message.textContent='Daftar rombongan gagal dimuat. Pilih ulang agenda untuk mencoba lagi.';});
    }

    function onBidangDiskumChange() {
      const bidang=document.getElementById('selectBidangDiskum').value,select=document.getElementById('selectPegawaiDiskum');
      select.replaceChildren(new Option(bidang?'-- Pilih Nama Pegawai Diskum --':'-- Pilih bidang / unit kerja terlebih dahulu --',''));
      select.value='';select.disabled=!bidang;
      const members=masterPegawai.filter(p=>p.bidang===bidang);members.forEach(p=>select.add(new Option(p.nama,String(p.id))));
      onPegawaiChange();
    }
    function onPegawaiChange() {
      const pId = document.getElementById('selectPegawaiDiskum').value;
      const found = masterPegawai.find(p => p.id == pId && p.bidang===document.getElementById('selectBidangDiskum').value);
      if (found) {
        document.getElementById('displayNip').innerText = found.nip||'-';
        document.getElementById('displayJabatan').innerText = found.jabatan;
      } else {
        document.getElementById('displayNip').innerText = '-';
        document.getElementById('displayJabatan').innerText = '-';
      }
    }

    function submitPresensiForm(e) {
      e.preventDefault();
      const selected=presensiMeetings.find(m=>String(m.id)===String(document.getElementById('selectRapat').value));
      const availability=attendanceFormAvailability(selected);
      if(!availability.open){alert(availability.message);return;}
      if (currentKategori === 'OPD_Pemko') {
        const opdCheck = String(document.getElementById('selectOpdPemko').value || '').trim();
        const wilayahInput = document.getElementById('inputWilayahPemko');
        if (wilayahInput && typeof wilayahInput.setCustomValidity === 'function') {
          wilayahInput.setCustomValidity(isPemkoWilayahType(opdCheck) && !String(wilayahInput.value || '').trim() ? ('Nama ' + opdCheck + ' wajib diisi.') : '');
        }
      } else if (currentKategori === 'Tamu_Luar') {
        const namaTamu = document.getElementById('inputNamaTamu');
        const instansiTamu = document.getElementById('inputInstansiTamu');
        const jabatanTamu = document.getElementById('inputJabatanTamu');
        if (namaTamu && typeof namaTamu.setCustomValidity === 'function') {
          namaTamu.setCustomValidity(!visitRosterMode && !String(namaTamu.value || '').trim() ? 'Nama lengkap wajib diisi.' : '');
        }
        if (instansiTamu && typeof instansiTamu.setCustomValidity === 'function') {
          instansiTamu.setCustomValidity(!String(instansiTamu.value || '').trim() ? 'Instansi asal wajib diisi.' : '');
        }
        if (jabatanTamu && typeof jabatanTamu.setCustomValidity === 'function') {
          jabatanTamu.setCustomValidity(!String(jabatanTamu.value || '').trim() ? 'Jabatan wajib diisi.' : '');
        }
      }
      if (!document.getElementById('formPresensi').reportValidity()) return;
      const rapatId = document.getElementById('selectRapat').value;
      if (!rapatId) {
        alert('Pilih agenda rapat terlebih dahulu.');
        return;
      }

      const btn = document.getElementById('btnSubmitPresensi');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Menyimpan...';

      let nama = '', nip = '', jabatan = '', namaOpd = 'Dinas Koperasi & UKM Batam';
      let pemkoOpd = '', pemkoWilayah = '';

      if (currentKategori === 'Diskum') {
        const pId = document.getElementById('selectPegawaiDiskum').value;
        const found = masterPegawai.find(p => p.id == pId && p.bidang===document.getElementById('selectBidangDiskum').value);
        if (!found) {
          alert('Pilih nama pegawai Diskum.');
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> Simpan Kehadiran Presensi Digital';
          return;
        }
        nama = found.nama;
        nip = found.nip;
        jabatan = found.jabatan;
      } else if (currentKategori === 'Tamu_Luar') {
        const member=visitRosterMode&&visitRosterData&&visitRosterData.roster.find(m=>m.id===document.getElementById('selectTamuRombongan').value);
        nama = visitRosterMode ? (member?member.nama:'') : document.getElementById('inputNamaTamu').value.trim();
        namaOpd = document.getElementById('inputInstansiTamu').value.trim();
        jabatan = document.getElementById('inputJabatanTamu').value.trim();
        if (!nama || !namaOpd || !jabatan) {
          alert('Isi nama, instansi asal, dan jabatan.'); btn.disabled=false;
          btn.innerHTML='<i class="fa-solid fa-paper-plane mr-2"></i> Simpan Kehadiran Presensi Digital'; return;
        }
      } else {
        nama = document.getElementById('inputNamaPemko').value.trim();
        nip = document.getElementById('inputNipPemko').value;
        jabatan = document.getElementById('inputJabatanPemko').value;
        pemkoOpd = String(document.getElementById('selectOpdPemko').value || '').trim();
        pemkoWilayah = String(document.getElementById('inputWilayahPemko').value || '').trim();
        if (!nama || !pemkoOpd || !PEMKO_OPD_OPTIONS.includes(pemkoOpd)) {
          alert('Pilih nama OPD dan masukkan nama Anda.');
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> Simpan Kehadiran Presensi Digital';
          return;
        }
        if (isPemkoWilayahType(pemkoOpd) && !pemkoWilayah) {
          alert('Masukkan Nama ' + pemkoOpd + '.');
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> Simpan Kehadiran Presensi Digital';
          return;
        }
        namaOpd = formatPemkoOpdName(pemkoOpd, pemkoWilayah);
      }

      const payload = {
        rapat_id: rapatId,
        kategori_peserta: currentKategori,
        member_id:visitRosterMode?document.getElementById('selectTamuRombongan').value:'',
        nama: nama,
        nip: nip,
        jabatan: jabatan,
        nama_opd: namaOpd,
        no_hp: document.getElementById('inputHp').value
      };
      if (currentKategori === 'OPD_Pemko') {
        payload.opd_pemko = pemkoOpd;
        if (isPemkoWilayahType(pemkoOpd)) payload.opd_pemko_wilayah = pemkoWilayah;
      }

      if(isAdminAttendance())payload.jam_kehadiran=document.getElementById('inputJamKehadiran').value;
      callBackend(isAdminAttendance()?'submitAdminPresensiRapat':'submitPresensiRapat', [payload], res => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> Simpan Kehadiran Presensi Digital';
        if (res.success) {
          alert(res.message);
          location.reload();
        } else {
          alert('Gagal: ' + res.error);
        }
      }, err => {
        console.error('submitPresensiRapat failed:', err);
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> Simpan Kehadiran Presensi Digital';
        alert('Presensi gagal disimpan. Periksa koneksi lalu coba lagi.');
      });
    }

    function callBackend(fnName, args, onSuccess, onError) {
      const handleError = onError || (err => console.error(fnName + ' failed:', err));
      if (window.google && google.script && google.script.run) {
        const runner = google.script.run.withSuccessHandler(onSuccess).withFailureHandler(handleError);
        if (!args || args.length === 0) runner[fnName]();
        else if (args.length === 1) runner[fnName](args[0]);
        else if (args.length === 2) runner[fnName](args[0], args[1]);
        else runner[fnName](args[0], args[1], args[2], args[3]);
      } else {
        fetch(`/api/${fnName}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(args ? args[0] : {})
        })
        .then(r => r.json())
        .then(onSuccess)
        .catch(handleError);
      }
    }
  </script>
</body>
</html>

<script>
  async function mergeVisitArchivePdf_(summary,sources,loadSource,onProgress=()=>{}) {
    if(typeof PDFLib==='undefined')throw new Error('Pustaka arsip PDF belum termuat. Muat ulang halaman.');
    const out=await PDFLib.PDFDocument.create();
    async function append(bytes){const src=await PDFLib.PDFDocument.load(bytes);const pages=await out.copyPages(src,src.getPageIndices());pages.forEach(page=>out.addPage(page));}
    await append(summary);
    const files=new Array(sources.length);let next=0,completed=0,failed=false;
    async function worker(){
      while(!failed&&next<sources.length){
        const index=next++;
        try{files[index]=await loadSource(index);if(!failed)onProgress(++completed,sources.length);}
        catch(error){failed=true;throw new Error('Arsip belum dapat dibuat. Dokumen '+(sources[index].name||index+1)+': '+error.message);}
      }
    }
    await Promise.all(Array.from({length:Math.min(2,sources.length)},()=>worker()));
    for(let i=0;i<sources.length;i++){
      try{
        const file=files[i],bytes=Uint8Array.from(atob(file.base64),c=>c.charCodeAt(0));files[i]=null;
        if(file.mime==='application/pdf')await append(bytes);
        else if(['image/jpeg','image/png'].includes(file.mime)){
          const image=file.mime==='image/png'?await out.embedPng(bytes):await out.embedJpg(bytes);
          const page=out.addPage([595.28,841.89]);const size=image.scale(Math.min(535.28/image.width,781.89/image.height));
          page.drawImage(image,{x:(595.28-size.width)/2,y:(841.89-size.height)/2,width:size.width,height:size.height});
        }else throw new Error('Format belum didukung. Gunakan PDF, JPG atau PNG.');
      }catch(error){throw new Error('Arsip belum dapat dibuat. Dokumen '+(sources[i].name||i+1)+': '+error.message);}
    }
    return out.save();
  }
  function buildVisitSummaryPdf_(data) {
    if(typeof jspdf==='undefined')throw new Error('Pustaka PDF belum termuat.');
    const doc=new jspdf.jsPDF({unit:'mm',format:'a4'}),v=data.visit,w=data.workflow;
    doc.setFontSize(17);doc.text('Arsip Kunjungan',20,24);doc.setFontSize(11);let y=36;
    const lines=['SI-TARI DISKUM',v.kode_kunjungan,v.instansi,'Tanggal kegiatan: '+String(w.booking&&w.booking.tanggal||v.tanggal_kunjungan||'-').split('-').reverse().join('-'),'Agenda: '+v.keperluan,'Status: '+w.status,'Catatan: '+(w.note||'-'),'Dokumen:'];
    (data.archiveSources||[]).forEach((s,i)=>lines.push((i+1)+'. '+(s.name||'Dokumen')));
    lines.forEach(text=>doc.splitTextToSize(String(text||'-'),170).forEach(line=>{if(y>275){doc.addPage();y=22;}doc.text(line,20,y);y+=6;}));
    return doc.output('arraybuffer');
  }
  async function downloadVisitArchive() {
    if(visitModalBusy||!visitModalData||visitModalData.workflow.status!=='Selesai')return;
    const data=visitModalData,button=document.getElementById('visitArchiveDownload');visitModalBusy=true;
    if(button){button.disabled=true;button.textContent='Menyiapkan arsip...';}
    try{
      const bytes=await mergeVisitArchivePdf_(buildVisitSummaryPdf_(data),data.archiveSources||[],index=>visitRpc('getVisitArchiveDocument',{kode_kunjungan:data.visit.kode_kunjungan,index}),(done,total)=>{if(button)button.textContent='Mengunduh dokumen '+done+'/'+total+'...';});
      const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));const a=document.createElement('a');a.href=url;a.download='Arsip_Kunjungan_'+data.visit.kode_kunjungan+'.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);
      showToast('success','Arsip siap','Seluruh dokumen berhasil digabungkan menjadi satu PDF.');
    }catch(error){showToast('error','Arsip gagal dibuat',error.message);}
    finally{visitModalBusy=false;if(button){button.disabled=false;button.innerHTML='<i class="fa-solid fa-file-pdf mr-2"></i>Unduh Arsip Kunjungan';}}
  }
  async function downloadVisitDocument(index,button) {
    if(!visitModalData||visitModalData.workflow.status!=='Selesai')return;
    const code=visitModalData.visit.kode_kunjungan;if(button)button.disabled=true;
    try {
      const file=await visitRpc('getVisitArchiveDocument',{kode_kunjungan:code,index});
      const bytes=Uint8Array.from(atob(file.base64),c=>c.charCodeAt(0));
      const url=URL.createObjectURL(new Blob([bytes],{type:file.mime})),a=document.createElement('a');
      const extension=file.mime==='application/pdf'?'.pdf':file.mime==='image/png'?'.png':'.jpg';
      a.href=url;a.download=/\.(pdf|png|jpe?g)$/i.test(file.name)?file.name:file.name+extension;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);
    }catch(error){showToast('error','Dokumen gagal diunduh',error.message);}finally{if(button)button.disabled=false;}
  }
  async function uploadAgendaNotula(id) {
    const meeting=allRapatData.find(r=>String(r.id)===String(id));if(!meeting)return;
    if(meeting.status==='Selesai'||meeting.notula)return;
    if(!meeting.kode_kunjungan&&!String(meeting.kode_rapat||'').startsWith('VISIT-')&&!(meeting.photos||[]).length){showToast('error','Foto wajib diunggah','Unggah minimal satu foto rapat sebelum E-notula.');return;}
    const input=document.createElement('input');input.type='file';input.accept='application/pdf,image/jpeg,image/png,image/webp,image/heic,image/heif';
    input.onchange=async()=>{
      const file=input.files[0];if(!file)return;
      if(file.size>5*1024*1024){showToast('error','File terlalu besar','Maksimal 5 MB.');return;}
      if(!visitFileMime(file)){showToast('error','Dokumen tidak valid','Pilih PDF / foto maksimal 5 MB.');return;}
      try{
        const encoded=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).replace(/^data:[^;]*;base64,/, 'data:'+visitFileMime(file)+';base64,'));r.onerror=()=>reject(new Error('File gagal dibaca. Silakan pilih ulang.'));r.readAsDataURL(file);});
        const result=await visitRpc('saveAgendaNotula',{rapat_id:id,file:{name:file.name,data:encoded}});
        meeting.notula=result;meeting.status='Selesai';renderMeetingsList(allRapatData);showToast('success','Agenda selesai','E-notula tersimpan dan tersedia untuk dilihat.');
      }catch(error){showToast('error','E-notula gagal disimpan',error.message);}
    };input.click();
  }
</script>

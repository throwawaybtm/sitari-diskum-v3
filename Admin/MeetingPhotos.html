<style>
  .meeting-camera {display:none;}
  #confirmLockRapatModal::backdrop,#confirmCancelRapatModal::backdrop,#confirmPostponeRapatModal::backdrop,#rescheduleRapatModal::backdrop {background:#0f172aaa;backdrop-filter:blur(5px);}
  #confirmLockRapatModal,#confirmCancelRapatModal,#confirmPostponeRapatModal,#rescheduleRapatModal {width:calc(100% - 24px);max-width:28rem;margin:auto;border:0;padding:0;border-radius:20px;color:#1e293b;}
  @media (max-width:767.98px), (max-width:1023.98px) and (hover:none) and (pointer:coarse) {
    #meetingEditAttachments button,#meetingEditAttachments a,#confirmLockRapatModal button,#confirmCancelRapatModal button,#confirmPostponeRapatModal button,#rescheduleRapatModal button {min-height:44px;}
    .meeting-camera {display:inline-flex;}
  }
</style>
<script>
  let meetingPhotosBusy=false;
  function renderMeetingEditPhotos(meeting) {
    const listEl=document.getElementById('meetingEditPhotoList'),uploadEl=document.getElementById('meetingEditPhotoUpload'),progressEl=document.getElementById('meetingPhotoProgress');
    if(!listEl)return;
    const locked=typeof isMeetingLocked==='function'?isMeetingLocked(meeting):Boolean(meeting&&(meeting.locked===true||String(meeting.status||'').trim().toLowerCase()==='terkunci'));
    const postponed=String(meeting&&meeting.status||'').trim()==='Ditunda';
    const uploadBlocked=locked||postponed;
    listEl.innerHTML=(meeting&&meeting.photos||[]).map((photo,index)=>{
      const id=String(photo.url||'').match(/\/d\/([-\w]+)|[?&]id=([-\w]+)/),thumb=id?'https://drive.google.com/thumbnail?id='+encodeURIComponent(id[1]||id[2])+'&sz=w400':photo.url;
      return `<div class="border border-slate-200 rounded-xl p-2 min-w-0 bg-white"><img src="${escapeHtml(thumb)}" alt="${escapeHtml(photo.name)}" loading="lazy" class="aspect-square w-full object-contain rounded-lg bg-slate-50"><p class="text-xs mt-2 break-all text-slate-700">${escapeHtml(photo.name)}</p><div class="grid grid-cols-2 gap-2 mt-2"><a href="${escapeHtml(photo.url)}" target="_blank" rel="noopener noreferrer" class="p-2 rounded-lg bg-teal-50 text-teal-800 text-center text-xs font-semibold">Lihat</a><button type="button" data-index="${index}" onclick="downloadMeetingPhoto(Number(this.dataset.index),this)" class="p-2 rounded-lg bg-sky-50 text-sky-800 text-xs font-semibold">Unduh</button></div></div>`;
    }).join('')||'<p class="text-xs text-slate-500">Belum ada foto.</p>';
    if(uploadEl){
      uploadEl.hidden=uploadBlocked;
      uploadEl.querySelectorAll('button,input').forEach(control=>control.disabled=uploadBlocked||meetingPhotosBusy);
    }
    if(progressEl)progressEl.textContent=meetingPhotosBusy?'Menyimpan foto…':'';
  }
  async function saveMeetingPhotos(input) {
    if(meetingPhotosBusy)return;
    const targetId=typeof editingRapatId!=='undefined'?editingRapatId:null;
    const meeting=allRapatData.find(row=>String(row.id)===String(targetId)),files=Array.from(input.files||[]);
    if(!meeting||!files.length)return;
    if(typeof isMeetingLocked==='function'&&isMeetingLocked(meeting)){input.value='';showToast('error','Agenda terkunci','Agenda sudah dikunci. Foto bersifat hanya-baca.');return;}
    if(String(meeting.status||'').trim()==='Ditunda'){input.value='';showToast('error','Agenda ditunda','Agenda rapat berstatus Ditunda. Jadwalkan ulang terlebih dahulu.');return;}
    if(files.length>5||files.length+(meeting.photos||[]).length>10||files.some(file=>file.size>5*1024*1024)||files.reduce((sum,file)=>sum+file.size,0)>10*1024*1024||files.some(file=>!String(visitFileMime(file)||'').startsWith('image/'))){input.value='';showToast('error','Foto tidak valid','Pilih 1–5 foto, maksimal 5 MB/foto, 10 MB/unggahan dan 10 foto/agenda.');return;}
    meetingPhotosBusy=true;
    if(typeof renderMeetingEditAttachments==='function')renderMeetingEditAttachments(meeting);else renderMeetingEditPhotos(meeting);
    try {
      const encoded=[];for(const file of files)encoded.push({name:file.name,data:await encodeVisitUploadFile(file,'Foto gagal dibaca.')});
      meeting.photos=await visitRpc('saveAgendaPhotos',{rapat_id:meeting.id,files:encoded});
      renderMeetingsList(allRapatData);
      const internal=meeting&&!meeting.kode_kunjungan&&!String(meeting.kode_rapat||'').startsWith('VISIT-');
      showToast('success','Foto tersimpan',internal?'Foto rapat tersimpan. E-notula dapat diunggah melalui form Edit Rapat.':'Foto agenda kunjungan tersimpan.');
    }catch(error){showToast('error','Foto gagal disimpan',error.message);}
    finally{input.value='';meetingPhotosBusy=false;if(typeof renderMeetingEditAttachments==='function')renderMeetingEditAttachments(meeting);else renderMeetingEditPhotos(meeting);}
  }
  async function downloadMeetingPhoto(index,button) {
    const id=typeof editingRapatId!=='undefined'?editingRapatId:null;
    if(id==null)return;
    if(button)button.disabled=true;
    try {const file=await visitRpc('getAgendaPhotoDocument',{rapat_id:id,index});const bytes=Uint8Array.from(atob(file.base64),char=>char.charCodeAt(0));const url=URL.createObjectURL(new Blob([bytes],{type:file.mime})),anchor=document.createElement('a');anchor.href=url;anchor.download=file.name;anchor.click();setTimeout(()=>URL.revokeObjectURL(url),60000);}catch(error){showToast('error','Unduh gagal',error.message);}finally{if(button)button.disabled=false;}
  }
</script>

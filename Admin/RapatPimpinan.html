].map(item => Object.freeze(item)));

let lastAutoFilledRapatPimpinan = '';

function findRapatPimpinanByBidang(bidang) {
  const key = String(bidang || '').trim();
  if (!key) return null;
  return RAPAT_PIMPINAN_DIRECTORY.find(item => item.bidang === key) || null;
}

function populateRapatBidangOptions() {
  const select = document.getElementById('rapatSelectBidang');
  if (!select) return;
  const current = select.value;
  select.replaceChildren(new Option('-- Pilih Bidang Penyelenggara --', ''));
  RAPAT_PIMPINAN_DIRECTORY.forEach(item => {
    select.add(new Option(item.bidang, item.bidang));
  });
  if (current && Array.from(select.options || []).some(opt => opt.value === current)) {
    select.value = current;
  }
}

function applyRapatBidangAutoFill() {
  const select = document.getElementById('rapatSelectBidang');
  const pimpinanInput = document.getElementById('rapatInputPimpinan');
  if (!select || !pimpinanInput) return null;
  const match = findRapatPimpinanByBidang(select.value);
  if (match) {
    pimpinanInput.value = match.nama;
    lastAutoFilledRapatPimpinan = match.nama;
    return match;
  }
  // Only clear Pimpinan Rapat on deselection if it was not manually overridden.
  if (!String(select.value || '').trim() && pimpinanInput.value === lastAutoFilledRapatPimpinan) {
    pimpinanInput.value = '';
  }
  lastAutoFilledRapatPimpinan = '';
  return null;
}

function resetRapatPimpinanAutoFill() {
  lastAutoFilledRapatPimpinan = '';
}
</script>

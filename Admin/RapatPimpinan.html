<script>
/**
 * Rapat Pimpinan: leaders come from Master_Pegawai ("Urutan_Pimpinan" / "Unit_Pimpinan" columns),
 * delivered with the meeting modal's room options and the E-Notula context. No names live here.
 * The Bidang Penyelenggara choices below are organisation units (not personal data); they keep the
 * dropdown usable when the sheet has no leader columns yet.
 */
const RAPAT_BIDANG_PENYELENGGARA_UNITS = Object.freeze([
  'Dinas',
  'Sekretariat',
  'Bidang Kewirausahaan',
  'Bidang Pemberdayaan dan Pelindungan Koperasi',
  'Bidang Pengawasan Koperasi',
  'Bidang Pengembangan Usaha Mikro',
  'UPTD Pengelolaan Dana Bergulir',
  'UPTD PLUT KUMKM',
  'Subbagian Keuangan dan Aset',
  'Subbagian Perencanaan Program',
  'Subbagian Umum dan Kepegawaian',
  'Subbagian Tata Usaha UPTD Pengelolaan Dana Bergulir',
  'Subbagian Tata Usaha UPTD PLUT KUMKM'
]);
let RAPAT_PIMPINAN_DIRECTORY = Object.freeze([]);

/** Replaces the leader list (from the server) and refreshes the Bidang Penyelenggara choices. */
function setRapatPimpinanDirectory(list) {
  const rows = (Array.isArray(list) ? list : [])
    .map(item => ({
      no: Number(item && item.no) || 0,
      nama: String(item && item.nama || '').trim(),
      nip: String(item && item.nip || '').trim(),
      pangkat_golongan: String(item && item.pangkat_golongan || '').trim(),
      bidang: String(item && item.bidang || '').trim()
    }))
    .filter(item => item.no > 0 && item.nama)
    .sort((a, b) => a.no - b.no);
  RAPAT_PIMPINAN_DIRECTORY = Object.freeze(rows.map(item => Object.freeze(item)));
  if (typeof document !== 'undefined' && document && typeof document.getElementById === 'function'
      && document.getElementById('rapatSelectBidang')) {
    populateRapatBidangOptions();
    const select = document.getElementById('rapatSelectBidang');
    const pimpinanInput = document.getElementById('rapatInputPimpinan');
    if (select && select.value && pimpinanInput && !String(pimpinanInput.value || '').trim() && !select.disabled) {
      applyRapatBidangAutoFill();
    }
  }
  return RAPAT_PIMPINAN_DIRECTORY;
}

/** Leader units in leadership order, then any standard unit not yet covered. */
function rapatBidangPenyelenggaraOptions() {
  const seen = new Set();
  const out = [];
  const add = value => {
    const key = String(value || '').trim();
    if (key && !seen.has(key)) { seen.add(key); out.push(key); }
  };
  RAPAT_PIMPINAN_DIRECTORY.forEach(item => add(item.bidang));
  RAPAT_BIDANG_PENYELENGGARA_UNITS.forEach(add);
  return out;
}

let lastAutoFilledRapatPimpinan = '';

function findRapatPimpinanByBidang(bidang) {
  const key = String(bidang || '').trim();
  if (!key) return null;
  return RAPAT_PIMPINAN_DIRECTORY.find(item => item.bidang === key) || null;
}

function populateRapatBidangOptions() {
  const select = document.getElementById('rapatSelectBidang');
  if (!select) return;
  const current = select.value;
  select.replaceChildren(new Option('-- Pilih Bidang Penyelenggara --', ''));
  rapatBidangPenyelenggaraOptions().forEach(bidang => {
    select.add(new Option(bidang, bidang));
  });
  if (current && Array.from(select.options || []).some(opt => opt.value === current)) {
    select.value = current;
  }
}

function applyRapatBidangAutoFill() {
  const select = document.getElementById('rapatSelectBidang');
  const pimpinanInput = document.getElementById('rapatInputPimpinan');
  if (!select || !pimpinanInput) return null;
  const match = findRapatPimpinanByBidang(select.value);
  if (match) {
    pimpinanInput.value = match.nama;
    lastAutoFilledRapatPimpinan = match.nama;
    return match;
  }
  // Only clear Pimpinan Rapat on deselection if it was not manually overridden.
  if (!String(select.value || '').trim() && pimpinanInput.value === lastAutoFilledRapatPimpinan) {
    pimpinanInput.value = '';
  }
  lastAutoFilledRapatPimpinan = '';
  return null;
}

function resetRapatPimpinanAutoFill() {
  lastAutoFilledRapatPimpinan = '';
}
</script>
